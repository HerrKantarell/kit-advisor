# On every push to main that changes site content:
# 1. bump <lastmod> in sitemap.xml to today (committed back to main)
# 2. wait for GitHub Pages to deploy, then ping IndexNow (Bing, Yandex, Seznam, Naver …)
#    Google does not support IndexNow — it reads sitemap.xml via Search Console.
name: IndexNow

on:
  push:
    branches: [main]
    paths:
      - index.html
      - llms.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: indexnow
  cancel-in-progress: true

env:
  HOST: kitadvisor.cc
  INDEXNOW_KEY: 576294f82ad8ed52e0685dad366b5ccf

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump sitemap lastmod
        run: |
          today=$(date -u +%F)
          sed -i -E "s#<lastmod>[0-9]{4}-[0-9]{2}-[0-9]{2}</lastmod>#<lastmod>${today}</lastmod>#" sitemap.xml
          if git diff --quiet sitemap.xml; then
            echo "sitemap already up to date"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: bump sitemap lastmod to ${today}"
            git push
          fi

      - name: Wait for GitHub Pages deploy
        run: sleep 120

      - name: Ping IndexNow
        run: |
          body=$(cat <<EOF
          {
            "host": "${HOST}",
            "key": "${INDEXNOW_KEY}",
            "keyLocation": "https://${HOST}/${INDEXNOW_KEY}.txt",
            "urlList": [
              "https://${HOST}/",
              "https://${HOST}/llms.txt"
            ]
          }
          EOF
          )
          status=$(curl -s -o response.txt -w '%{http_code}' \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "$body" https://api.indexnow.org/indexnow)
          echo "IndexNow HTTP ${status}"; cat response.txt
          # 200 = OK, 202 = accepted (key validation pending)
          [[ "$status" == "200" || "$status" == "202" ]]
