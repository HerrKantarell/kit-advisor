<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#F7F7F5"/>

  <!-- Left green bar -->
  <rect width="6" height="630" fill="#347962"/>

  <!-- Brand -->
  <text x="80" y="210" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="400" font-size="130" fill="#347962" letter-spacing="-2">Kit</text>
  <text x="292" y="210" font-family="Georgia, 'Times New Roman', serif" font-style="normal" font-weight="400" font-size="130" fill="rgba(52,121,98,0.35)">/</text>
  <text x="352" y="210" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="400" font-size="130" fill="#111111" letter-spacing="-2">Advisor</text>

  <!-- Tagline -->
  <text x="80" y="280" font-family="-apple-system, Helvetica Neue, Arial, sans-serif" font-size="28" fill="#5a5a57" letter-spacing="0.12em">CYCLING CLOTHING BY WEATHER</text>

  <!-- Divider -->
  <line x1="80" y1="320" x2="560" y2="320" stroke="#E2E2DF" stroke-width="1"/>

  <!-- Kit tiers -->
  <text x="80" y="370" font-family="ui-monospace, 'SF Mono', 'Courier New', monospace" font-size="18" fill="#5a5a57">≥ 22°  Short sleeve jersey</text>
  <text x="80" y="400" font-family="ui-monospace, 'SF Mono', 'Courier New', monospace" font-size="18" fill="#5a5a57">17°    Jersey + arm warmers</text>
  <text x="80" y="430" font-family="ui-monospace, 'SF Mono', 'Courier New', monospace" font-size="18" fill="#5a5a57">12°    Long sleeve + thin gloves</text>
  <text x="80" y="460" font-family="ui-monospace, 'SF Mono', 'Courier New', monospace" font-size="18" fill="#5a5a57">7°     Thermal jersey + bib tights</text>
  <text x="80" y="490" font-family="ui-monospace, 'SF Mono', 'Courier New', monospace" font-size="18" fill="#5a5a57">2°     Winter jacket + heavy gloves</text>
  <text x="80" y="520" font-family="ui-monospace, 'SF Mono', 'Courier New', monospace" font-size="18" fill="#5a5a57">&lt; 2°   Double layer + balaclava</text>

  <!-- URL bottom right -->
  <text x="1120" y="590" font-family="ui-monospace, 'SF Mono', 'Courier New', monospace" font-size="22" fill="#347962" text-anchor="end" letter-spacing="0.04em">kitadvisor.cc</text>

  <!-- Right side decorative element — temperature circle -->
  <circle cx="960" cy="315" r="200" fill="none" stroke="#E2E2DF" stroke-width="1"/>
  <circle cx="960" cy="315" r="150" fill="none" stroke="#E2E2DF" stroke-width="0.5"/>

  <!-- Temp number -->
  <text x="960" y="280" font-family="ui-monospace, 'SF Mono', 'Courier New', monospace" font-size="22" fill="#5a5a57" text-anchor="middle" letter-spacing="0.1em">FEELS LIKE</text>
  <text x="960" y="380" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="120" fill="#347962" text-anchor="middle">+8°</text>

  <!-- Wind / speed labels -->
  <text x="760" y="320" font-family="ui-monospace, 'SF Mono', 'Courier New', monospace" font-size="14" fill="#5a5a57" text-anchor="middle">12°C air</text>
  <text x="760" y="340" font-family="ui-monospace, 'SF Mono', 'Courier New', monospace" font-size="14" fill="#347962" text-anchor="middle">28 km/h</text>
  <text x="1160" y="320" font-family="ui-monospace, 'SF Mono', 'Courier New', monospace" font-size="14" fill="#5a5a57" text-anchor="middle">2.5 h</text>
  <text x="1160" y="340" font-family="ui-monospace, 'SF Mono', 'Courier New', monospace" font-size="14" fill="#347962" text-anchor="middle">tempo</text>
</svg>
